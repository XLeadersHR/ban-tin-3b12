  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(G.s),iterations:G.v,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  var t=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(G.n)},key,b(G.c));
  return new TextDecoder().decode(t);
}
function hien(html){document.open();document.write(html);document.close();}
var luu=null; try{luu=localStorage.getItem("bt3b12-mk");}catch(e){}
if(luu){ mo(luu).then(hien).catch(function(){ try{localStorage.removeItem("bt3b12-mk");}catch(e){} }); }
document.getElementById("f").onsubmit=function(e){
  e.preventDefault(); var mk=document.getElementById("mk").value.trim(), loi=document.getElementById("loi");
  loi.textContent="Đang mở...";
  mo(mk).then(function(h){ if(document.getElementById("nho").checked){ try{localStorage.setItem("bt3b12-mk",mk);}catch(e){} } hien(h); })
        .catch(function(){ loi.textContent="Mật khẩu chưa đúng, bố mẹ thử lại nhé."; });
};
