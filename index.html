function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function mo(mk){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(mk),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(G.s),iterations:G.v,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  var t=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(G.n)},key,b(G.c));
  return new TextDecoder().decode(t);
}
